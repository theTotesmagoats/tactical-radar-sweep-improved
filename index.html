<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ATLAS Protocol - Executive Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #02040a; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'VT323', monospace;
            overflow: hidden;
            user-select: none;
        }

        #chassis {
            background-color: #0a1128; 
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05) 0%, transparent 70%),
                url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.04"/%3E%3C/svg%3E');
            width: 96vw;
            height: 96vh;
            padding: 40px 40px 60px 40px; 
            border-radius: 16px; 
            box-sizing: border-box;
            box-shadow: inset 0 0 40px #010205, 0 0 50px rgba(10, 17, 40, 0.8), 0 20px 50px rgba(0,0,0,0.9);
            border: 8px solid #050814;
            border-top: 8px solid #080d1f;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #news-ticker {
            width: 100%;
            background: #030712;
            border: 1px solid rgba(88, 166, 255, 0.3);
            color: #94a3b8;
            padding: 5px 15px;
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-sizing: border-box;
            margin-bottom: 15px;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        
        .ticker-text {
            display: inline-block;
            animation: scroll-ticker 20s linear infinite;
        }

        @keyframes scroll-ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-150%); }
        }

        #screen {
            background: #030712; 
            width: 100%;
            flex-grow: 1;
            border-radius: 12px;
            padding: 25px;
            box-sizing: border-box;
            border: 2px solid rgba(88, 166, 255, 0.2); 
            box-shadow: inset 0 0 80px rgba(0,0,0,1), 0 0 15px rgba(88, 166, 255, 0.05);
            position: relative;
            display: flex;
            flex-direction: column;
            color: #f8fafc; 
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.8), 0 0 8px rgba(255, 255, 255, 0.3); 
            font-size: 1.5rem; 
            letter-spacing: 1px;
            line-height: 1.35;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.98; }
            50% { opacity: 1; }
            100% { opacity: 0.99; }
        }

        #screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 5;
            background-size: 100% 3px;
            pointer-events: none;
        }

        #output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 15px;
            z-index: 3;
            word-wrap: break-word;
        }

        .msg-block { margin-bottom: 15px; }

        #input-line {
            display: flex; 
            align-items: center;
            font-weight: bold;
            z-index: 3;
            margin-bottom: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #prompt { margin-right: 15px; color: #58a6ff; }

        input[type="text"] {
            background: transparent;
            border: none;
            color: inherit;
            font-family: 'VT323', monospace;
            font-size: 1em;
            flex-grow: 1;
            outline: none;
            text-transform: uppercase;
            text-shadow: inherit;
            letter-spacing: 2px;
        }

        #hud-bar {
            border-top: 2px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
            margin-top: auto;
            font-size: 1.6rem;
            color: #f8fafc;
            z-index: 3;
            display: flex;
            justify-content: space-between;
        }

        .hud-stat { font-weight: bold; transition: color 0.3s, text-shadow 0.3s; }
        .stat-critical { color: #e63946 !important; text-shadow: 0 0 8px #e63946 !important; animation: blinker 1s infinite; }
        .stat-optimal { color: #4ade80 !important; text-shadow: 0 0 8px #4ade80 !important; }
        @keyframes blinker { 50% { opacity: 0.4; } }

        /* THE LEXICON ENGINE */
        .lexicon-term {
            color: #58a6ff;
            text-decoration: underline;
            text-decoration-style: dotted;
            cursor: help;
            position: relative;
            text-shadow: 0 0 5px rgba(88, 166, 255, 0.6);
        }

        @media (hover) {
            .lexicon-term::after {
                content: attr(data-definition);
                position: absolute;
                top: 140%;
                bottom: auto;
                left: 0;
                width: 450px;
                background: #050814;
                border: 1px solid #58a6ff;
                color: #f8fafc;
                padding: 15px;
                font-family: 'VT323', monospace;
                font-size: 1.3rem;
                line-height: 1.3;
                text-align: left;
                box-shadow: 0 15px 40px rgba(0,0,0,0.95);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s;
                z-index: 9999;
                white-space: normal;
                text-shadow: none;
            }
            .lexicon-term:hover::after { opacity: 1; }
        }

        /* PROGRESSIVE DISCLOSURE COMPONENTS */
        .btn-container { display: flex; gap: 15px; margin-top: 5px; margin-bottom: 5px; }
        .decrypt-btn, .audit-btn {
            display: inline-block; padding: 2px 10px; cursor: pointer; font-family: inherit; font-size: 0.9em; transition: all 0.2s; user-select: none;
        }
        .decrypt-btn { background: rgba(230, 57, 70, 0.1); border: 1px solid #e63946; color: #e63946; text-shadow: 0 0 5px #e63946; }
        .decrypt-btn:hover { background: #e63946; color: #030712; box-shadow: 0 0 15px rgba(230, 57, 70, 0.6); text-shadow: none; }
        .audit-btn { background: rgba(74, 222, 128, 0.1); border: 1px solid #4ade80; color: #4ade80; text-shadow: 0 0 5px #4ade80; }
        .audit-btn:hover { background: #4ade80; color: #030712; box-shadow: 0 0 15px rgba(74, 222, 128, 0.6); text-shadow: none; }
        .accordion-content {
            max-height: 0; overflow: hidden; opacity: 0; transition: max-height 0.4s ease-out, opacity 0.4s ease-out, padding 0.4s;
            color: #cbd5e1; text-shadow: none; padding-left: 15px;
        }
        .accordion-content.expanded { max-height: 1500px; opacity: 1; padding-top: 10px; padding-bottom: 10px; }
        .content-red { border-left: 2px solid #e63946; }
        .content-green { border-left: 2px solid #4ade80; background: rgba(74, 222, 128, 0.05); }

        .voice-cos { color: #94a3b8; font-weight: bold; } 
        .voice-friedman { color: #ffffff; font-weight: bold; text-shadow: 0 0 5px #fff; } 
        .highlight-directive { color: #58a6ff; font-weight: bold; } 
        .sys-alert { color: #e63946; text-shadow: 0 0 5px #e63946; font-weight: bold; } 
        .sys-success { color: #4ade80; text-shadow: 0 0 5px #4ade80; font-weight: bold; }
        .audit-header { color: #4ade80; font-weight: bold; letter-spacing: 2px; display: block; margin-bottom: 5px; }

        .time-jump-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.9); z-index: 100;
            display: flex; justify-content: center; align-items: center;
            font-size: 5rem; color: #58a6ff; font-weight: bold;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
            text-shadow: 0 0 20px #58a6ff;
        }
        .time-jump-overlay.active { opacity: 1; }

    </style>
</head>

    <div class="audit-btn" onclick="toggleAccordion(this, 'audit-btn')">[+] PULL HISTORICAL AUDIT</div>

<div class="accordion-content content-red">You are injecting absolute <u class="lexicon-term" data-definition="A situation where a party is protected from risk, and therefore acts recklessly. True incentive: Profits are privatized; losses are socialized.">Moral Hazard</u> into the banking sector. The 'seen' effect is a housing boom. The 'unseen' effect is an economy built on adjustable-rate leverage. You are trading a mild recession today for a catastrophic depression in six years.</div>

    function updateHUD() {
        document.getElementById('hud-year').innerText = `YEAR: ${metrics.year}`;
        document.getElementById('hud-pp').innerText = `PP: ${metrics.pp}%`;
        document.getElementById('hud-pol').innerText = `POL: ${metrics.pol}%`;
        document.getElementById('hud-vel').innerText = `VEL: ${metrics.vel}%`;
        document.getElementById('hud-fric').innerText = `FRIC: ${metrics.friction}%`;
        
        const ppEl = document.getElementById('hud-pp');
        const polEl = document.getElementById('hud-pol');
        const fricEl = document.getElementById('hud-fric');

        ppEl.className = 'hud-stat'; polEl.className = 'hud-stat'; fricEl.className = 'hud-stat';

        if(metrics.pp < 50) ppEl.classList.add('stat-critical');
        if(metrics.pp > 110) ppEl.classList.add('stat-optimal');
        if(metrics.pol < 20) polEl.classList.add('stat-critical');
        if(metrics.friction > 80) fricEl.classList.add('stat-critical');

        updateTicker();
    }

    function printText(textString, speed = 8, callback) {
        isTyping = true; inputField.disabled = true;
        let i = 0; let currentHTML = "";
        const block = document.createElement('div');
        block.className = 'msg-block';
        outputDiv.appendChild(block);

        function type() {
            if (i < textString.length) {
                if (textString.charAt(i) === '<') {
                    let tag = "";
                    while (textString.charAt(i) !== '>' && i < textString.length) { tag += textString.charAt(i); i++; }
                    tag += '>'; currentHTML += tag;
                } else { currentHTML += textString.charAt(i); }
                block.innerHTML = currentHTML; i++;
                outputDiv.scrollTop = outputDiv.scrollHeight;
                setTimeout(type, speed);
            } else {
                isTyping = false; inputField.disabled = false; inputField.focus();
                if (callback) callback();
            }
        }
        type();
    }

    function toggleAccordion(btn, type) {
        let targetContent = btn.parentElement.nextElementSibling;
        if (type === 'audit-btn') {
            targetContent = btn.parentElement.nextElementSibling.nextElementSibling;
            if(!targetContent || !targetContent.classList.contains('accordion-content')) targetContent = btn.nextElementSibling; 
        }
        if (targetContent && targetContent.classList.contains('accordion-content')) {
            targetContent.classList.toggle('expanded');
            if (type === 'decrypt-btn') {
                btn.innerText = targetContent.classList.contains('expanded') ? '[-] COLLAPSE STRUCTURAL AUDIT' : '[+] DECRYPT SECOND-ORDER PHYSICS';
            } else if (type === 'audit-btn') {
                btn.innerText = targetContent.classList.contains('expanded') ? '[-] CLOSE HISTORICAL AUDIT' : '[+] PULL HISTORICAL AUDIT';
            }
            setTimeout(() => outputDiv.scrollTop = outputDiv.scrollHeight, 150);
        }
    }

    function executeMetricsCommand() {
        const hReal = historicalReality[metrics.year] || { pp: 'N/A', pol: 'N/A', vel: 'N/A', fric: 'N/A', optimal_fric: '0' };
        let metricsOutput = `> EXECUTING STRUCTURAL AUDIT [EPOCH: ${metrics.year}]...\n\n`;
        metricsOutput += `<span style="color:#94a3b8;">--------------------------------------------------</span>\n`;
        metricsOutput += `<span style="color:#f8fafc; font-weight:bold;">METRIC                 PLAYER    | HISTORICAL | OPTIMAL</span>\n`;
        metricsOutput += `<span style="color:#94a3b8;">--------------------------------------------------</span>\n`;
        metricsOutput += `Purchasing Power (PP): <span style="color:#58a6ff;">${metrics.pp.toString().padEnd(9)}</span> | ${hReal.pp.toString().padEnd(10)} | 100+\n`;
        metricsOutput += `Systemic Fric. (FRIC): <span style="color:#e63946;">${metrics.friction.toString().padEnd(9)}</span> | ${hReal.fric.toString().padEnd(10)} | 0\n`;
        metricsOutput += `Capital Velocity (VEL):<span style="color:#f8fafc;">${metrics.vel.toString().padEnd(9)}</span> | ${hReal.vel.toString().padEnd(10)} | 100+\n`;
        metricsOutput += `Political Cap. (POL):  <span style="color:#4ade80;">${metrics.pol.toString().padEnd(9)}</span> | ${hReal.pol.toString().padEnd(10)} | N/A\n`;
        metricsOutput += `<span style="color:#94a3b8;">--------------------------------------------------</span>\n`;
        
        const echoBlock = document.createElement('div');
        echoBlock.style.color = '#58a6ff';
        echoBlock.style.marginBottom = '15px';
        echoBlock.innerHTML = `> METRICS`;
        outputDiv.appendChild(echoBlock);
        inputField.value = '';

        printText(metricsOutput);
    }

    function simulateLag(yearsToPass, targetNode) {
        inputField.disabled = true;
        isTyping = true;
        let count = 0;
        
        function tick() {
            if (count < yearsToPass) {
                metrics.year++;
                timeOverlay.innerText = metrics.year;
                timeOverlay.classList.add('active');
                
                // Slight random drift during transition to simulate market noise
                metrics.vel += Math.floor(Math.random() * 5) - 2;
                if(metrics.friction > 50) metrics.pp -= 2; 
                
                updateHUD();
                
                setTimeout(() => { timeOverlay.classList.remove('active'); }, 400);
                count++;
                setTimeout(tick, 1000);
            } else {
                isTyping = false;
                inputField.disabled = false;
                
                // Check Weimar condition post-lag
                if (metrics.pp <= 20) {
                    renderNode('WEIMAR_COLLAPSE');
                } else {
                    renderNode(targetNode);
                }
            }
        }
        setTimeout(tick, 500);
    }

    function renderNode(nodeId) {
        currentNodeId = nodeId;
        const nodeRaw = storyNodes[nodeId];
        
        if (nodeRaw.lag) {
            simulateLag(nodeRaw.lag.years, nodeRaw.lag.target);
            return;
        }

        if (typeof nodeRaw.effect === 'function') {
            nodeRaw.effect(metrics);
            updateHUD();
        }

        let textToPrint = typeof nodeRaw.text === 'function' ? nodeRaw.text(metrics) : nodeRaw.text;
        printText(textToPrint);
        
        // Immediate check for Weimar
        if (metrics.pp <= 20 && nodeId !== 'WEIMAR_COLLAPSE') {
            setTimeout(() => { renderNode('WEIMAR_COLLAPSE'); }, 2000);
        }
    }

    function handleInput(rawCmd) {
        if (isTyping) return;
        const cmd = rawCmd.trim().toUpperCase().replace(/\s+/g, '_');
        if (cmd === '') return;

        if (cmd === 'METRICS') {
            executeMetricsCommand();
            return;
        }

        const echoBlock = document.createElement('div');
        echoBlock.style.color = '#58a6ff';
        echoBlock.style.marginBottom = '15px';
        echoBlock.innerHTML = `> ${cmd}`;
        outputDiv.appendChild(echoBlock);
        inputField.value = '';

        const node = storyNodes[currentNodeId];
        let nextNodeId = null;

        let availableChoices = typeof node.choices === 'function' ? node.choices(metrics) : node.choices;

        if (availableChoices) {
            for (const [key, val] of Object.entries(availableChoices)) {
                if (cmd === key.toUpperCase()) {
                    nextNodeId = val;
                    break;
                }
            }
            if (nextNodeId && storyNodes[nextNodeId]) {
                renderNode(nextNodeId);
            } else {
                printText(`<span class="sys-alert">> UNRECOGNIZED COMMAND. VALIDATE INPUT.</span>`, 5);
            }
        }
    }

    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); handleInput(inputField.value); }
    });

    setTimeout(() => { updateHUD(); renderNode('SETUP_2002'); }, 500);

</script>
