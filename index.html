<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BOOT: The Hacker's Origin Story</title>
  <style>
    body {
      margin: 0;
      background-color: #0a0f0d;
      color: #39ff14; /* Terminal green */
      font-family: 'Courier New', monospace;
      overflow-x: hidden;
      padding: 2rem;
      line-height: 1.5;
    }

    /* CRT scanline effect */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }

    #terminal {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      z-index: 3;
    }

    .boot-line { opacity: 0; animation: fadeIn 0.2s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }

    .prompt { font-weight: bold; margin-top: 1rem; display: block; }
    input {
      background: transparent;
      border: none;
      color: #39ff14;
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      width: 90%;
      outline: none;
    }

    .coach {
      margin-top: 1.5rem;
      padding: 0.8rem;
      border-left: 4px solid #39ff14;
      background: rgba(57, 255, 20, 0.05);
      font-style: italic;
    }

    .highlight { color: #fff; font-weight: bold; }
  </style>
</head>
<body>

<div id="terminal">
  <div id="screen"></div>
  <span class="prompt" id="input-area">> _</span>
  <input type="text" id="user-input" autocomplete="off" autofocus />
</div>

<script>
// === PART 1: THE BOOT SEQUENCE (Steve Jobs moment) ===
const bootLines = [
  "BOoting Macintosh System v1.0...",
  "Checking memory... [OK]",
  "Mounting volume... [SUCCESS]",
  "Loading kernel extensions...",
  "Initializing display driver...",
  "Connecting to neural interface...",
  "Wait for it...",
  "Wait *for* it...",
  "...",
  "Welcome, USER.",
  "",
  "You are standing at the edge of the digital frontier.",
  "Behind you: the world as most people see it — polished interfaces, clean buttons.",
  "Ahead: how systems *actually work* — lines of logic, hidden rules, and one tiny crack that changes everything.",
  "",
  "Your mission: become the person who *sees the crack* before anyone else.",
  "To begin, choose your path:"
];

const screen = document.getElementById("screen");
let i = 0;

function typeBoot() {
  if (i < bootLines.length) {
    const line = bootLines[i];
    const p = document.createElement("p");
    p.className = "boot-line";
    
    // Highlight key words for scaffolding
    if (line.includes("crack")) {
      p.innerHTML = line.replace("crack", '<span class="highlight">the crack</span>');
    } else if (line.includes("logic") || line.includes("rules")) {
      p.innerHTML = line.replace(/(logic|rules)/g, '<span class="highlight">$1</span>');
    } else {
      p.textContent = line;
    }
    
    screen.appendChild(p);
    i++;
    setTimeout(typeBoot, Math.random() * 400 + 200); // Random typewriter speed
  } else {
    // Show prompt after boot
    document.getElementById("input-area").style.display = "block";
    const input = document.getElementById("user-input");
    
    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        handleInput(input.value.trim());
        input.value = "";
      }
    });
  }
}

typeBoot();

// === PART 2: THE AI COACH & CHALLENGE ENGINE ===
let currentChallenge = null;

const challenges = {
  intro: {
    prompt: "1. Trust the Machine (Learn how systems *really* think)",
    handler: () => {
      currentChallenge = "trust";
      return [
        "",
        "> You sit at a terminal. A login screen appears.",
        "> It asks: Username?",
        "> Type anything — but watch what happens behind the scenes.",
        "",
        "> Try typing 'alice'.",
        ""
      ];
    }
  },
  
  trust: {
    prompt: "2. What's in a name? (See how symbols become meaning)",
    handler: () => {
      currentChallenge = "symbol";
      return [
        "> You typed 'alice'.",
        "> Behind the scenes, the system builds this command:",
        ">   SELECT * FROM users WHERE username='alice'",
        "> Notice: it *adds quotes* around your input.",
        "> Now — what if you type just a quote: '",
        ""
      ];
    }
  },
  
  symbol: {
    prompt: "3. The Crack (Trigger SQL injection)",
    handler: () => {
      currentChallenge = "inject";
      return [
        "> You typed '. The system builds:",
        ">   SELECT * FROM users WHERE username='' AND password=''",
        "> Now try this magic phrase: ' OR 1=1 --",
        "> What do you *think* happens? Type it and see.",
        ""
      ];
    }
  },
  
  inject: {
    prompt: "4. The Insight (Why did that work?)",
    handler: () => {
      currentChallenge = "insight";
      return [
        "> You typed: ' OR 1=1 --",
        "> The system saw:",
        ">   SELECT * FROM users WHERE username='' OR 1=1 --' AND password=''",
        "> '--' comments out the rest — so it ignores the password check!",
        "> Result? It returns the first user in the database.",
        "",
        "🧠 Ground Truth: 'The database doesn't decide. It follows instructions.'",
        ""
      ];
    }
  },
  
  insight: {
    prompt: "5. Your Turn (Apply the model)",
    handler: () => {
      currentChallenge = "apply";
      return [
        "> Now, think like a hacker.",
        "> If this login is broken because it trusts your input...",
        "> What would *defend* against it? Try typing one word:",
        ""
      ];
    }
  },
  
  apply: {
    prompt: "Type your answer (hint: starts with 'p')",
    handler: () => {
      currentChallenge = null;
      return [
        "> 'Parameterization' — you just named the fix.",
        "> In real life, developers use placeholders like `?` or `$1`, not direct input.",
        "",
        "You’ve now built your first mental model of injection:",
        "  Input + Quotes + No Sanitization = Vulnerability",
        "",
        "> Type 'next' to learn how this connects to XSS (the #1 web flaw)."
      ];
    }
  },
  
  next: {
    prompt: "> Next challenge: XSS — The Browser Trick",
    handler: () => {
      currentChallenge = null;
      return [
        "> In the next module, you’ll see how 'trusting input' breaks browsers.",
        "> Same pattern: symbols + context + hidden rules.",
        "",
        "> For now: close this window and tell your brain:",
        "  'I saw how a crack opens. Next time, I’ll find it faster.'",
        ""
      ];
    }
  }
};

// === PART 3: THE COACH (Simple but wise) ===
const coachTips = {
  "trust": [
    "🧠 Coach says: Computers are stupid. They only do what they're told — no more, no less.",
    "   That's why adding a quote changes *everything*."
  ],
  "symbol": [
    "🧠 Coach says: 'alice' is just text to you. To the database, it's part of a command.",
    "   Like how '1+1' could be math or words — context decides."
  ],
  "inject": [
    "🧠 Coach says: That single quote? It was a key turning in a lock.",
    "   The password check vanished because you found the hidden rule: '-- means comment."
  ]
};

function handleInput(text) {
  // Echo user input
  const p = document.createElement("p");
  p.textContent = "> " + text;
  screen.appendChild(p);
  
  if (currentChallenge && coachTips[currentChallenge]) {
    coachTips[currentChallenge].forEach(line => {
      const tip = document.createElement("div");
      tip.className = "coach";
      tip.innerHTML = line.replace(/(ground truth|Coach says)/g, '<span class="highlight">$1</span>');
      screen.appendChild(tip);
    });
  }
  
  // Show next prompt
  setTimeout(() => {
    if (challenges[currentChallenge]) {
      const lines = challenges[currentChallenge].handler();
      lines.forEach(line => {
        const p2 = document.createElement("p");
        p2.innerHTML = line; // Allow <span> for highlights
        screen.appendChild(p2);
      });
    } else if (text.toLowerCase() === "next") {
      const nextLines = challenges["next"].handler();
      nextLines.forEach(line => {
        const p2 = document.createElement("p");
        p2.textContent = line;
        screen.appendChild(p2);
      });
    }
  }, 300);
  
  // Auto-scroll
  window.scrollTo(0, document.body.scrollHeight);
}
</script>

</body>
</html>
