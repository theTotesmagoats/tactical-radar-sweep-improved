<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BOOT v4.1 // IT ACTUALLY WORKS</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: 'VT323', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    #container {
      width: 90%;
      max-width: 800px;
      margin-top: 10vh;
      position: relative;
    }
    
    #screen {
      min-height: 300px;
      font-size: 28px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-y: auto;
      max-height: 70vh;
      margin-bottom: 16px;
      padding-right: 10px;
    }
    
    #screen::-webkit-scrollbar { width: 8px; }
    #screen::-webkit-scrollbar-track { background: transparent; }
    #screen::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }
    
    .boot-line {
      margin-bottom: 12px;
    }
    
    input {
      background: transparent;
      border: none;
      color: white;
      font-family: 'VT323', monospace;
      font-size: 28px;
      width: 100%;
      outline: none;
      caret-color: #FFB000;
    }
    
    .cursor-block {
      display: inline-block;
      width: 16px;
      height: 24px;
      background: #FFB000;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }
    
    @keyframes blink { 
      0%, 100% { opacity: 1; } 
      50% { opacity: 0; } 
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="screen"></div>
    <input type="text" id="user-input" autocomplete="off" />
  </div>
  
  <script>
    const screen = document.getElementById('screen');
    const input = document.getElementById('user-input');
    
    // Boot sequence: text appears after 0.5 seconds
    setTimeout(() => {
      // Add boot lines one by one
      addLine('> Hello, future hacker.');
      setTimeout(() => addLine('> I see you\'ve found me.'), 400);
      setTimeout(() => addLine('> Let\'s learn how to speak my language.'), 800);
      setTimeout(() => {
        // Show input and focus it
        input.style.display = 'block';
        input.focus();
        
        // Add the "typing" indicator after a pause
        const typingLine = document.createElement('div');
        typingLine.className = 'boot-line';
        typingLine.innerHTML = '> Type anything to begin<span class="cursor-block"></span>';
        screen.appendChild(typingLine);
        screen.scrollTop = screen.scrollHeight;
      }, 1200);
    }, 500);
    
    // Add a line to the screen and auto-scroll
    function addLine(text) {
      const line = document.createElement('div');
      line.className = 'boot-line';
      line.textContent = text;
      screen.appendChild(line);
      screen.scrollTop = screen.scrollHeight;
    }
    
    // Handle input
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const text = input.value.trim();
        
        if (text !== '') {
          addLine('> ' + text);
          
          // Simple response
          setTimeout(() => {
            addLine('');
            setTimeout(() => addLine('[BOOT-1]: Interesting. Let\'s see what happens...'), 300);
            setTimeout(() => addLine('[BOOT-1]: Try typing \'alice\' to begin'), 800);
          }, 500);
        }
        
        input.value = '';
      }
    });
    
    // Hide input initially
    input.style.display = 'none';
  </script>
</body>
</html>
