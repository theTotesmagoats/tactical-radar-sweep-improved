<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BOOT v4 // IT WORKS</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: 'VT323', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    #screen {
      width: 80%;
      text-align: left;
      font-size: 32px;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }
    
    input {
      background: transparent;
      border: none;
      color: white;
      font-family: 'VT323', monospace;
      font-size: 32px;
      width: 80%;
      outline: none;
      caret-color: #FFB000;
    }
    
    .cursor {
      display: inline-block;
      width: 16px;
      height: 28px;
      background: #FFB000;
      animation: blink 1s step-end infinite;
    }
    
    @keyframes blink { 
      0%, 100% { opacity: 1; } 
      50% { opacity: 0; } 
    }
  </style>
</head>
<body>
  <div id="screen"></div>
  <input type="text" id="user-input" autocomplete="off" autofocus />
  
  <script>
    const screen = document.getElementById('screen');
    const input = document.getElementById('user-input');
    
    // Boot sequence: text appears after 0.5 seconds
    setTimeout(() => {
      screen.innerHTML = '> Hello, future hacker.<br><br>> Type anything to begin';
      input.focus();
    }, 500);
    
    // Handle input
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const text = input.value.trim();
        
        if (text !== '') {
          screen.innerHTML += `<br>> ${text}`;
          
          // Simple response
          setTimeout(() => {
            screen.innerHTML += `<br><br>> [BOOT-1]: Interesting. Let's see what happens...`;
            screen.innerHTML += `<br>> Try typing 'alice'`;
          }, 500);
        }
        
        input.value = '';
      }
    });
  </script>
</body>
</html>
