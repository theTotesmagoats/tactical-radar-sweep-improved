<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BOOT v1.5 // GROUND TRUTH TERMINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --amber: #FFB000;
      --green: #00ff66;
      --bg: #050505;
      --panel: rgba(0,0,0,0.7);
      --border: rgba(255,176,0,0.7);
    }
    html, body {
      margin: 0; padding: 0;
      background: #000; color: var(--amber);
      font-family: 'VT323', monospace;
      height: 100vh; overflow: hidden;
      text-shadow: 0 0 4px rgba(255,176,0,.5);
    }
    #terminal {
      width: 100%; height: 100%;
      padding: 3vh 5vw;
      box-sizing: border-box;
      display: flex; flex-direction: column;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
    }
    
    /* CRT scanline effect */
    #terminal::before {
      content:""; position:absolute; inset:0;
      pointer-events:none; z-index:99;
      background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,.25) 50%),
                  linear-gradient(90deg, rgba(255,0,0,.06), rgba(0,255,0,.02), rgba(0,0,255,.06));
      background-size: 100% 3px, 4px 100%;
    }

    .led-panel {
      display:flex; gap:12px; margin-bottom:1.5vh;
      font-size:28px;
    }
    .led-label { color:#777; text-shadow:none; letter-spacing:2px; }
    .led { width:14px; height:14px; border-radius:50%;
           background:#330000; box-shadow: inset 0 2px 4px #000;
           transition: all .2s ease; }
    .led.on { background:var(--green); 
              box-shadow: 0 0 12px var(--green), inset 0 2px 6px rgba(255,255,255,.4); }

    #screen {
      flex:1; overflow-y:auto;
      font-size:32px; line-height:1.4;
      scrollbar-width: thin; scrollbar-color: var(--amber) transparent;
    }
    #screen::-webkit-scrollbar { width: 8px; }
    #screen::-webkit-scrollbar-thumb { background: rgba(255,176,0,.4); border-radius: 4px; }

    .boot-line { animation: fadeIn .3s forwards; opacity:0; margin-bottom:.8vh; }
    @keyframes fadeIn { to { opacity:1; } }

    .highlight { color:#fff; font-weight:bold; text-shadow:0 0 6px #fff; }
    .coach {
      margin-top:1.2vh; padding-left:1.5vh;
      border-left:3px solid var(--amber);
      background:rgba(255,176,0,.08);
      font-style:italic; color:#ffeaa7;
    }

    #menu { display:none; margin-top:2vh; }
    .menu-item {
      padding:.8vh 1.5vh; border-radius:3px;
      background:rgba(255,176,0,.05);
      transition: all .1s ease;
    }
    .menu-item:hover { background:rgba(255,176,0,.15); cursor:pointer; }

    #input-area {
      display:none; margin-top:1.8vh; font-size:34px;
      position:relative;
    }
    .prompt { margin-right:12px; color:#fff; text-shadow:0 0 5px #fff; }
    input {
      background:transparent; border:none; color:var(--amber);
      font-family:'VT323', monospace; font-size:inherit;
      width:90%; outline:none; caret-color:var(--green);
    }

    /* CRT flicker effect */
    @keyframes flicker { 0%{opacity:.95} 100%{opacity:.98} }
    #crt-flicker {
      position:absolute; inset:0; pointer-events:none;
      animation:flicker .2s infinite;
      z-index:50;
    }

    @media (max-width:768px) { font-size:1.4em; }
  </style>
</head>
<body>

<div id="terminal">
  <div class="led-panel">
    <span class="led-label">PWR</span><div class="led on" id="power-led"></div>
    <span class="led-label" style="margin-left:8px;">DAT</span><div class="led" id="data-led"></div>
  </div>

  <div id="screen">
    <!-- Boot messages and menu appear here -->
  </div>

  <div id="menu"></div>
  
  <div id="input-area"><span class="prompt">BOOT-1:></span><input type="text" id="user-input" autocomplete="off" autofocus /></div>
</div>
<div id="crt-flicker"></div>

<script>
// === CONFIGURATION ===
const bootLines = [
  "Booting Macintosh System v1.0...",
  "Checking memory... [OK]",
  "Mounting volume... [SUCCESS]",
  "Initializing neural interface...",
  "Connecting to ground truths...",
  "Loading scaffolded learning modules...",
  "[WAITING FOR USER]"
];

const coachTips = {
  trust: [
    "> Coach BOOT-1 says:",
    "  'Computers are stupid. They only do what they're told — no more, no less.'",
    "  That's why adding a quote changes *everything*."
  ],
  inject: [
    "> Coach BOOT-1 says:",
    "  'The database doesn't decide. It follows instructions.'",
    "  Like a recipe that can't say 'no' to weird ingredients."
  ]
};

// === STATE ===
let currentChallenge = null;
const screen = document.getElementById("screen");
const menuContainer = document.getElementById("menu");
const inputArea = document.getElementById("input-area");
const inputField = document.getElementById("user-input");

// === BOOT SEQUENCE (Steve Jobs moment) ===
function typeBoot() {
  let i = 0;
  
  function step() {
    if (i < bootLines.length) {
      const p = document.createElement("p");
      p.className = "boot-line";
      
      // Highlight key words for scaffolding
      if (bootLines[i].includes("ground truths")) {
        p.innerHTML = bootLines[i].replace("ground truths", '<span class="highlight">ground truths</span>');
      } else if (bootLines[i].includes("scaffolded")) {
        p.innerHTML = bootLines[i].replace("scaffolded", '<span class="highlight">scaffolded</span>');
      } else {
        p.textContent = bootLines[i];
      }
      
      screen.appendChild(p);
      i++;
      
      // Flash data LED
      const led = document.getElementById('data-led');
      led.classList.add('on');
      setTimeout(() => led.classList.remove('on'), 150);

      setTimeout(step, Math.random() * 350 + 200); // Random typewriter speed
    } else {
      // Show menu after boot
      showMenu();
    }
  }
  step();
}

function showMenu() {
  inputArea.style.display = "none"; // Hide input until choice made
  const menuItems = [
    { num: 1, text: "Trust the Machine (Learn how systems *really* think)" },
    { num: 2, text: "Hack a Fake Website (See injection in action)" },
    { num: 3, text: "How Data Flows (Network basics)" }
  ];

  menuContainer.innerHTML = "";
  
  menuItems.forEach(item => {
    const div = document.createElement("div");
    div.className = "menu-item";
    div.innerHTML = `<span class="highlight">[${item.num}]</span> ${item.text}`;
    
    // Click handler
    div.onclick = () => handleChoice(item.num);
    div.onmouseenter = () => div.style.background = "rgba(255,176,0,.15)";
    div.onmouseleave = () => div.style.background = "rgba(255,176,0,.05)";
    
    menuContainer.appendChild(div);
  });

  // Show menu + input
  menuContainer.style.display = "block";
  inputArea.style.display = "flex";
  
  // Focus input for typing choice
  setTimeout(() => {
    inputField.focus();
    screen.scrollTop = screen.scrollHeight;
  }, 100);
}

// === CHOICE HANDLER ===
function handleChoice(num) {
  menuContainer.innerHTML = ""; // Clear menu
  
  const choiceLine = document.createElement("p");
  choiceLine.className = "boot-line";
  choiceLine.textContent = `> Selected: [${num}] ${getMenuText(num)}`;
  screen.appendChild(choiceLine);
  
  setTimeout(() => {
    if (num === 1) startChallenge("trust");
    else if (num === 2) startChallenge("inject");
    else if (num === 3) startChallenge("network");
  }, 600);
}

function getMenuText(num) {
  const texts = [
    "Trust the Machine",
    "Hack a Fake Website",
    "How Data Flows"
  ];
  return texts[num-1];
}

// === CHALLENGE ENGINE ===
const challenges = {
  trust: {
    prompt: "> Try typing 'alice' to begin.",
    nextStep: (text) => text.toLowerCase() === 'alice' ? 'trust2' : null,
    coach: 'trust'
  },
  trust2: {
    prompt: "> Now try just a single quote: '",
    nextStep: (text) => text === "'" ? 'sql' : null
  },
  sql: {
    prompt: "> Watch what happens behind the scenes...",
    showSQL: true,
    coach: 'trust'
  },
  inject: {
    prompt: "> You're at a login screen. Type 'alice' to begin.",
    nextStep: (text) => text.toLowerCase() === 'alice' ? 'inject2' : null
  },
  inject2: {
    prompt: "> Now type this magic phrase: ' OR 1=1 --",
    nextStep: (text) => text.includes("' OR 1=1") ? 'injection-reveal' : null,
    coach: 'inject'
  }
};

function startChallenge(name) {
  currentChallenge = name;
  
  // Show prompt
  const p = document.createElement("p");
  p.className = "boot-line";
  p.innerHTML = challenges[name].prompt.replace(/([']/g, '<span class="highlight">$1</span>');
  screen.appendChild(p);
  
  inputField.value = "";
  inputField.focus();
}

// === INPUT HANDLER ===
inputField.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    const text = inputField.value.trim();
    
    // Echo user input
    const line = document.createElement("p");
    line.className = "boot-line";
    line.textContent = `> ${text}`;
    screen.appendChild(line);
    inputField.value = "";
    
    // Show coach tip if available
    if (challenges[currentChallenge] && challenges[currentChallenge].coach) {
      showCoach(challenges[currentChallenge].coach);
    }
    
    // Check for next step
    const nextName = challenges[currentChallenge]?.nextStep?.(text);
    if (nextName) {
      setTimeout(() => startChallenge(nextName), 400);
    } else if (challenges[currentChallenge]?.showSQL) {
      showSQL();
    }
    
    screen.scrollTop = screen.scrollHeight;
  }
});

function showCoach(name) {
  const tips = coachTips[name];
  if (!tips) return;
  
  tips.forEach(line => {
    const div = document.createElement("div");
    div.className = "coach";
    div.innerHTML = line.replace(/(ground truth|Coach BOOT-1 says)/g, '<span class="highlight">$1</span>');
    screen.appendChild(div);
  });
}

function showSQL() {
  const sqlLines = [
    "> You typed 'alice'. The system builds:",
    ">   SELECT * FROM users WHERE username='alice'",
    "",
    "> Now type just '. Watch how it changes the command:",
    ">   SELECT * FROM users WHERE username='' AND password=''",
    "",
    "> That single quote becomes part of the syntax! This is injection.",
    ""
  ];
  
  sqlLines.forEach(line => {
    const p = document.createElement("p");
    p.className = "boot-line";
    if (line.includes("SELECT")) {
      p.innerHTML = line.replace(/(')/g, '<span class="highlight">$1</span>');
    } else {
      p.textContent = line;
    }
    screen.appendChild(p);
  });
  
  // Show next prompt after SQL
  setTimeout(() => {
    const nextP = document.createElement("p");
    nextP.className = "boot-line";
    nextP.innerHTML = "> Now try: <span class='highlight'>' OR 1=1 --</span>";
    screen.appendChild(nextP);
    
    currentChallenge = 'inject';
    inputField.focus();
  }, 800);
}

// === INIT ===
window.onload = typeBoot;
</script>

</body>
</html>
