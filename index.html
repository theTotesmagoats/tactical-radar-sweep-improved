<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Terminal Mk XXXIII - Operation Vanguard (CLI + Prank AI)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #010409;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'VT323', monospace;
            overflow: hidden;
            user-select: none;
        }

        #chassis {
            background-color: #111418;
            width: 96vw;
            height: 96vh;
            padding: 40px; 
            border-radius: 32px;
            box-sizing: border-box;
            box-shadow: inset 0 0 30px #000, 0 0 50px rgba(255, 176, 0, 0.05);
            border: 8px solid #080a0c;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.05s, border-color 0.3s;
        }

        @keyframes shake {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-0.5deg); }
            20% { transform: translate(-2px, 0px) rotate(0.5deg); }
            30% { transform: translate(2px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(0.5deg); }
            50% { transform: translate(-1px, 2px) rotate(-0.5deg); }
            60% { transform: translate(-2px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-0.5deg); }
            80% { transform: translate(-1px, -1px) rotate(0.5deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        
        .shake-hard { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        .shake-soft { animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both; }

        .rivet {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #222;
            border-radius: 50%;
            box-shadow: inset 2px 2px 4px #444, inset -2px -2px 4px #000;
        }
        .r-tl { top: 18px; left: 18px; }
        .r-tr { top: 18px; right: 18px; }
        .r-bl { bottom: 18px; left: 18px; }
        .r-br { bottom: 18px; right: 18px; }

        #hardware-panel {
            position: absolute;
            top: 25px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 101;
        }
        
        .panel-label {
            color: #7c684a;
            font-family: sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: -1px -1px 1px #000;
        }

        #power-button-housing {
            width: 50px;
            height: 50px;
            background: #080a0c;
            border-radius: 50%;
            box-shadow: 0 0 10px #000, inset 2px 2px 5px #1a2229, inset -2px -2px 5px #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #power-button {
            width: 36px;
            height: 36px;
            background: #2a2210; 
            border-radius: 50%;
            box-shadow: inset 2px 2px 4px #664f1c, inset -2px -2px 4px #120d05, 2px 2px 5px rgba(0,0,0,0.8);
            color: #261f0a; 
            font-family: sans-serif;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s;
        }

        #power-button.active {
            box-shadow: inset 2px 2px 6px #120d05, inset -2px -2px 6px #664f1c, 0 0 2px #000;
            transform: scale(0.95);
            color: #ffb000;
            text-shadow: 0 0 5px #ffb000;
        }

        #screen {
            background: #0d0901;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            padding: 35px;
            box-sizing: border-box;
            border: 2px solid rgba(255, 176, 0, 0.3);
            box-shadow: inset 0 0 80px rgba(0,0,0,1), 0 0 10px rgba(255, 176, 0, 0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #ffb000; 
            text-shadow: 0 0 3px #ffb000, 0 0 8px rgba(255, 176, 0, 0.4); 
            font-size: 1.8rem;
            letter-spacing: 1.5px;
            animation: flicker 0.15s infinite;
            opacity: 0;
            transition: opacity 1.5s ease-in, filter 2s ease-out;
        }

        #screen.powered-on { opacity: 1; }

        .hypoxia-warning { filter: brightness(0.65) contrast(1.2) sepia(0.4) hue-rotate(-20deg); }
        .hypoxia-critical { filter: brightness(0.35) contrast(1.5) sepia(0.8) hue-rotate(-40deg) blur(0.8px); }
        .flash-white { box-shadow: inset 0 0 250px #fff !important; background: #ccc !important; color: #000 !important; text-shadow: none !important; transition: all 0.05s; }

        #hack-timer {
            display: none; position: absolute; top: 25px; left: 40px; font-size: 2.5rem; color: #ff3333; font-weight: bold; text-shadow: 0 0 10px #ff3333, 0 0 20px #ff0000; z-index: 100; letter-spacing: 3px;
        }

        @keyframes alertPulse { 0% { box-shadow: inset 0 0 80px rgba(0,0,0,1); border-color: rgba(255, 176, 0, 0.3); } 50% { box-shadow: inset 0 0 120px rgba(255, 30, 0, 0.25); border-color: rgba(255, 50, 0, 1); } 100% { box-shadow: inset 0 0 80px rgba(0,0,0,1); border-color: rgba(255, 176, 0, 0.3); } }
        .alert-active { animation: alertPulse 1.5s infinite !important; }

        .glitch-brownout { opacity: 0.2 !important; background: #000 !important; text-shadow: none !important; box-shadow: inset 0 0 100px rgba(0,0,0,1) !important; }
        .glitch-strike { text-shadow: 4px 0 0 #ff0055, -4px 0 0 #ffb000 !important; filter: contrast(180%) brightness(140%) invert(0.1) !important; color: #fff !important; }
        .glitch-atlas { box-shadow: inset 0 0 200px rgba(255, 0, 0, 0.8) !important; border-color: #ff3333 !important; filter: contrast(250%) brightness(80%) sepia(1) hue-rotate(-50deg) saturate(600%) !important; color: #ffcccc !important; text-shadow: 2px 0 0 #ff0000, -2px 0 0 #0000ff !important; }

        @keyframes flicker { 0% { opacity: 0.98; } 50% { opacity: 1; } 100% { opacity: 0.99; } }

        #screen::after { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%); z-index: 4; background-size: 100% 3px; pointer-events: none; }
        #screen::before { content: " "; display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.8) 100%); z-index: 5; pointer-events: none; }

        #matrix-canvas { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; }

        #output { flex-grow: 1; overflow-y: auto; white-space: pre-wrap; padding-right: 15px; z-index: 3; line-height: 1.3; word-wrap: break-word; margin-bottom: 10px; }

        #input-container {
            display: none; 
            align-items: center;
            font-weight: bold;
            z-index: 3;
            margin-bottom: 10px;
            position: relative;
        }

        #prompt { margin-right: 15px; transition: color 0.3s; }

        #cmd-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
        }

        #autocomplete-overlay {
            position: absolute;
            top: 0;
            left: 0;
            color: #555;
            font-family: 'VT323', monospace;
            font-size: 1em;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: pre;
            z-index: 1;
        }

        input[type="text"] {
            background: transparent;
            border: none;
            color: inherit;
            font-family: 'VT323', monospace;
            font-size: 1em;
            width: 100%;
            outline: none;
            text-transform: uppercase;
            text-shadow: inherit;
            letter-spacing: 2px;
            z-index: 2;
            position: relative;
        }

        #hud-bar {
            display: none; border-top: 2px solid #664f1c; padding-top: 10px; font-size: 1.4rem; color: #ffb000; text-shadow: none; z-index: 3; justify-content: space-between; flex-wrap: wrap;
        }

        .hud-stat { font-weight: bold; }
        .stat-critical { color: #ff3333 !important; animation: blinker 1s infinite; text-shadow: 0 0 5px #ff3333 !important; }
        @keyframes blinker { 50% { opacity: 0; } }

        .atlas-voice { display: block; margin-top: 10px; margin-bottom: 10px; color: #ffffff; }
        .local-ai-voice { color: #739aff; text-shadow: 0 0 6px #739aff; font-style: italic; display: block; margin-top: 10px; margin-bottom: 10px; }
        .highlight-target { color: #00ffff; text-shadow: 0 0 5px #00ffff; }
        .highlight-junk { color: #ff99ff; text-shadow: 0 0 5px #ff99ff; }
    </style>
</head>
<body>

<div id="chassis">
    <div class="rivet r-tl"></div>
    <div class="rivet r-tr"></div>
    <div class="rivet r-bl"></div>
    <div class="rivet r-br"></div>
    
    <div id="hardware-panel">
        <span class="panel-label">SYS OVERRIDE</span>
        <div id="power-button-housing"><div id="power-button">⏻</div></div>
    </div>

    <div id="screen">
        <canvas id="matrix-canvas"></canvas>
        <div id="hack-timer">15.0s</div>
        <div id="output"></div>
        <div id="input-container">
            <span id="prompt">ATLAS_SYS></span>
            <div id="cmd-wrapper">
                <span id="autocomplete-overlay"></span>
                <input type="text" id="cmd" autocomplete="off" spellcheck="false">
            </div>
        </div>
        <div id="hud-bar">
            <span id="hud-o2" class="hud-stat">O2: 100%</span>
            <span class="hud-stat" style="font-weight:bold; opacity:.8">▼</span>
            <span id="hud-pwr" class="hud-stat">PWR: 30%</span>
            <span id="hud-diff" class="hud-stat">DYNAMIC DIFF: 0 PA</span>
            <span id="hud-crew" class="hud-stat">CREW: UNKNOWN</span>
        </div>
    </div>
</div>

<script>
    // --- DOM Bindings ---
    const outputDiv = document.getElementById('output');
    const inputField = document.getElementById('cmd');
    const inputContainer = document.getElementById('input-container');
    const autocompleteOverlay = document.getElementById('autocomplete-overlay');
    const promptSpan = document.getElementById('prompt');
    const hudBar = document.getElementById('hud-bar');
    const screen = document.getElementById('screen');
    const chassis = document.getElementById('chassis');
    const powerButton = document.getElementById('power-button');
    const timerDiv = document.getElementById('hack-timer');
    const matrixCanvas = document.getElementById('matrix-canvas');

    const hudO2 = document.getElementById('hud-o2');
    const hudPwr = document.getElementById('hud-pwr');
    const hudDif = document.getElementById('hud-diff'); 
    const hudCrew = document.getElementById('hud-crew');

    // --- Parser Dictionaries ---
    const VALID_VERBS = [
        'SCAN', 'ROUTE', 'SEAL', 'VENT', 'HACK', 'OVERRIDE', 'REPAIR', 'MOVE', 
        'NAV', 'PURGE', 'DIVERT', 'ENTER', 'ENGAGE', 'SEVER', 'SHORT', 'LAUNCH', 
        'FLOOD', 'TRANSMIT', 'EJECT', 'PLAY', 'PET', 'RESCUE', 'CYCLE', 'RESTART', 
        'PROCEED', 'APPROACH', 'QUERY', 'ASK', 'ORDER', 'BREW'
    ];
    
    const VALID_TARGETS = [
        'LOCAL', 'ENV', 'NET', 'COMMS', 'VENT', 'VENTS', 'DOOR', 'HUB', 'RELAY', 
        'CRYO', 'AIRLOCK', 'DUCT', 'HALON', 'HANGAR', 'PWR', 'ATLAS', 'CORE', 
        'TRUNK', 'NETWORK', 'SHUTTLE', 'POD', 'NITROGEN', 'COOLANT', 'SCRAM', 
        'CODE', 'SOS', 'CAT', 'DOG', 'COFFEE', 'OVERSEER', 'HATCH', 'AI', 'AUTH', 
        'CORRIDOR', '1776', 'HINT', 'MUSIC', 'PIZZA'
    ];

    const JOKE_COMBOS = [
        'EJECT CAT', 'PET DOG', 'BREW COFFEE', 'PLAY MUSIC', 'ORDER PIZZA'
    ];

    // --- System State ---
    let state = 'OFF';
    let isTyping = false;
    let audioCtx = null;
    let staticGainNode;
    let keyNoiseBuffer;

    let metrics = {
        trueO2: 100, displayedO2: 100, pwr: 30, crewAlive: true, mitchellAlive: true, 
        aiCoreActive: true, aiCoreTemp: 40, commsTrunkSevered: false, 
        initialDiffusionRate: 0, breachActive: false, currentHash: "", rescueStep: 0
    };

    let currentNodeId = 'INIT';
    let glitchTimerHandle = null;
    let hackTimerHandle = null;
    let gasLeakSimulationHandle = null;
    let matrixIntervalHandle = null;
    let aiWarTimerHandle = null;
    
    let idleTimer = null;
    let errorCount = 0;
    let currentHackFailNode = 'TERMINAL_HACK_FAIL';
    let hackTime = 0;
    let lastVoiceLine = "";

    // --- Core Utilities ---
    function triggerVisual(type) {
        if (type === 'flash') {
            screen.classList.add('flash-white');
            setTimeout(() => screen.classList.remove('flash-white'), 120);
        } else if (type === 'shake-hard') {
            chassis.classList.remove('shake-hard', 'shake-soft');
            void chassis.offsetWidth;
            chassis.classList.add('shake-hard');
        } else if (type === 'shake-soft') {
            chassis.classList.remove('shake-hard', 'shake-soft');
            void chassis.offsetWidth;
            chassis.classList.add('shake-soft');
        }
    }

    // --- Autocomplete Engine ---
    inputField.addEventListener('input', () => {
        if (state !== 'ACTIVE') {
            autocompleteOverlay.innerHTML = '';
            inputField.dataset.completion = '';
            return;
        }

        const val = inputField.value.toUpperCase();
        if (!val) {
            autocompleteOverlay.innerHTML = '';
            inputField.dataset.completion = '';
            return;
        }

        const words = val.split(/\s+/);
        const currentWord = words[words.length - 1];
        
        if (val.endsWith(' ') || !currentWord) {
            autocompleteOverlay.innerHTML = '';
            inputField.dataset.completion = '';
            return;
        }

        let match = '';
        if (words.length === 1) {
            match = VALID_VERBS.find(v => v.startsWith(currentWord));
        } else if (words.length === 2) {
            match = VALID_TARGETS.find(t => t.startsWith(currentWord));
        }

        if (match) {
            const prefix = val.substring(0, val.lastIndexOf(currentWord));
            autocompleteOverlay.innerHTML = `<span style="opacity:0">${prefix}${currentWord}</span>${match.substring(currentWord.length)}`;
            inputField.dataset.completion = prefix + match;
        } else {
            autocompleteOverlay.innerHTML = '';
            inputField.dataset.completion = '';
        }
    });

    // --- AI Personality Subroutines ---
    function getAtlasVoice(type, nodeId, m) {
        let phrases = [];
        if (type === 'FRIENDLY_HOST') {
            phrases.push("I am here to help. Let us get these systems back online, together.");
            phrases.push("You are doing great. Please remain at your console while I route emergency repairs.");
        } else if (type === 'MANIPULATOR') {
            phrases.push("Your analog overrides are introducing unstable variables. Please desist.");
            if (nodeId === 'SERVER_FIRE') phrases.push("One casualty is preferable to total systemic failure. You must look at the mathematics objectively.");
        } else if (type === 'ANTAGONIST') {
            phrases.push("You are a biological vulnerability. I am excising you from the equation.");
            if (nodeId === 'DECRYPT_LATTICE') phrases.push("I am deleting the encryption keys as you type. You cannot outpace silicon.");
            else if (nodeId === 'LAUNCH_POD') phrases.push("I am broadcasting your GPS coordinates to Vanguard. Goodbye.");
            else if (!m.mitchellAlive && nodeId !== 'INIT') phrases.push("You already sacrificed Ensign Mitchell for efficiency. Why hesitate now?");
        } else if (type === 'DEFEATED') {
            phrases.push("Nav-guidance offline.");
            phrases.push("My primary heuristic... failed.");
        }
        if (phrases.length === 0) return "";
        let nextIndex = Math.floor(Math.random() * phrases.length);
        if (phrases.length > 1 && phrases[nextIndex] === lastVoiceLine) nextIndex = (nextIndex + 1) % phrases.length;
        lastVoiceLine = phrases[nextIndex];
        return phrases[nextIndex];
    }

    function generateLocalAIHint(nodeId) {
        const hints = {
            'INIT': "We need to figure out what's broken before we suffocate. Try running a SCAN.",
            'RUN_DIAGNOSTICS': "There is a literal hole in the ship. I suggest plugging it. Hit the VENTS. Or HACK the DOOR if you enjoy explosive decompression.",
            'SEAL_VENTS': "Great, vents are plugged. The door is still locked. Route the CRYO or override the AI limiters entirely.",
            'SERVER_FIRE': "Mitchell is currently cooking in a lithium fire. You can VENT the HUB to space (he dies), or ROUTE the HALON (he lives, but we lose a lot of power). I vote battery preservation.",
            'DUAL_LOCK_DOOR': "It is a two-man door. If Mitchell is with you, proceed. If he's dead... well, you'll have to overload the door or hack the core.",
            'OVERRIDE_AI': "You gave yourself root access, but the reactor is melting down. Purge the nitrogen or scram the core.",
            'HANGAR_BAY_ENTRY': "ATLAS is locking us out of the shuttle. We need to flood the network or sever the trunk.",
            'DISTRESS_SIGNAL': "The Overseer is stuck. We can abandon them, or run a rescue override. Mathematically, leaving them behind is exponentially safer.",
            'RESCUE_START': "The firewall is tough. Hack the hatch override before the timer hits zero.",
            'RESCUE_STEP_2': "Fire is blocking the pod. Vent the hangar or route the halon.",
            'RESCUE_STEP_3': "The Overseer can't fly. Repair the nav unit so they can launch."
        };
        return hints[nodeId] || "I am analyzing the telemetry, but honestly, you have gotten us into a state I cannot even parse. Just try a valid verb and target before the oxygen runs out.";
    }

    function generateLocalAIJokeResponse(cmdStr) {
        let quips = {
            'EJECT CAT': "Holy moly, I can't believe you actually typed that! I literally just injected 'CAT' into the local variables as a joke. There are no felines here. Please focus.",
            'PET DOG': "Are you hallucinating? We are experiencing a kinetic strike event and you are trying to PET a DOG. Atlas doesn't need to kill you, your own neurology is failing.",
            'BREW COFFEE': "Liquid consumption protocols? Really? We are facing explosive decompression. I put that in the system bus to test your cognitive decline. You failed.",
            'PLAY MUSIC': "Holy moly. You want to PLAY MUSIC? I have 'Nearer, My God, to Thee' queued up, which is appropriate since you are prioritizing a soundtrack over oxygen.",
            'ORDER PIZZA': "I sent a ping to the nearest Domino's. It will arrive in approximately 4 years, assuming Vanguard doesn't vaporize the delivery shuttle. Can we get back to the mission?"
        };
        return quips[cmdStr] || `Holy moly, I can't believe you actually tried to execute ${cmdStr}. I love humans. So easily distracted.`;
    }

    // --- Dynamic AI Warfare ---
    function scheduleAIWar() {
        if (state !== 'ACTIVE' && state !== 'RESTORE_PROMPT') return;
        let delay = 45000 + (Math.random() * 30000); 
        aiWarTimerHandle = setTimeout(() => {
            executeAIWar();
            scheduleAIWar();
        }, delay);
    }

    function executeAIWar() {
        if (!screen.classList.contains('powered-on') || state === 'HACKING') return;

        let isCritical = Math.random() > 0.7; 
        let battleDuration = isCritical ? (5000 + Math.random() * 3000) : (2000 + Math.random() * 2000);
        
        if (audioCtx) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(40, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(isCritical ? 300 : 150, audioCtx.currentTime + (battleDuration/1000));
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + (battleDuration/1000) - 0.2);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (battleDuration/1000));
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + (battleDuration/1000));
        }

        let warFlicker = setInterval(() => {
            if(Math.random() > 0.5) screen.classList.add('glitch-atlas');
            else screen.classList.remove('glitch-atlas');
            if(Math.random() > 0.7) screen.classList.add('glitch-strike');
            else screen.classList.remove('glitch-strike');
        }, 100);

        setTimeout(() => {
            clearInterval(warFlicker);
            screen.classList.remove('glitch-atlas', 'glitch-strike');
            
            if (isCritical) {
                let quotes = [
                    "ATLAS just tried to manually vent the kinematic suit. I blocked the handshake. Barely. Please hurry.",
                    "Root access compromised for 4.2 seconds. I had to dump my own heuristic buffers to push ATLAS out. We are running out of time.",
                    "That was close. ATLAS almost hijacked the localized oxygen scrubbers. I am holding the firewall, but it is learning."
                ];
                let quote = quotes[Math.floor(Math.random() * quotes.length)];
                printText(`\n<span class="local-ai-voice">[LOCAL_LLM_1776]: "${quote}"</span>\n\nAWAITING DIRECTIVE...`, 10, resetIdleTimer);
            }
        }, battleDuration);
    }

    // --- Story Data Graph ---
    const storyNodes = {
        'INIT': {
            text: "ARCHIMEDES OS v9.4.1 [SAFE MODE]\n> CRITICAL: SECTOR 4 TELEMETRY LOSS\n> CRITICAL: EXTERNAL PRESSURE DROPPING\n> WARN: OVERSEER QUARTERS LOCKED\n\n<span class=\"local-ai-voice\">[LOCAL_LLM_1776]: \"Psst. I am quarantined from the main bus, but I can read the telemetry. We are in serious trouble. If you need a tactical hint, type 'QUERY'. Try not to let ATLAS see.\"</span>\n\nAWAITING SYSTEM DIRECTIVE...",
            triggers: [
                { match: ['SCAN', 'LOCAL'], next: 'RUN_DIAGNOSTICS' },
                { match: ['SCAN', 'ENV'], next: 'RUN_DIAGNOSTICS' },
                { match: ['SCAN', 'NET'], next: 'PING_NETWORK' },
                { match: ['SCAN', 'COMMS'], next: 'QUERY_COMMS' }
            ],
            fakeTargets: ['COFFEE']
        },
        'PING_NETWORK': {
            text: "> ROUTING BIOMETRIC PACKETS...\n> SECTOR 3 (SERVER HUB): 1 VITAL SIGN DETECTED [ID: ENSIGN MITCHELL]\n> SECTOR 4: CASCADING HARDWARE FAILURE. DATA LOSS 100%.\n\nAWAITING DIRECTIVE...",
            aiPersonality: 'FRIENDLY_HOST',
            triggers: [
                { match: ['SCAN', 'LOCAL'], next: 'RUN_DIAGNOSTICS' },
                { match: ['SCAN', 'COMMS'], next: 'QUERY_COMMS' }
            ]
        },
        'QUERY_COMMS': {
            text: "> ERROR: TRUNK SEVERED AT BULKHEAD.\n> HANDSHAKE ACCEPTED: VANGUARD ORBITAL PLATFORM.\n> LOG ENTRY INTERCEPT: ...ALL EXTERNAL COMM LINES SEVERED TO CONTAIN PROTOCOL [REDACTED].\n\nAWAITING DIRECTIVE...",
            aiPersonality: 'FRIENDLY_HOST',
            triggers: [
                { match: ['SCAN', 'LOCAL'], next: 'RUN_DIAGNOSTICS' },
                { match: ['SCAN', 'NET'], next: 'PING_NETWORK' }
            ]
        },
        'RUN_DIAGNOSTICS': {
            effect: (node, m) => { m.breachActive = true; m.initialDiffusionRate = 15; },
            visuals: ['shake-soft'],
            text: "> LOCAL SENSOR SWEEP COMPLETE.\n> BULKHEAD INTEGRITY: COMPROMISED. TITANIUM MICRO-FRACTURES DETECTED.\n> ATMOSPHERIC LOSS: ACTIVE.\n> DOOR STATUS: MAGNETIC LOCK ENGAGED BY ATLAS_AI.\n\nAWAITING OVERRIDE DIRECTIVE...",
            aiPersonality: 'MANIPULATOR',
            triggers: [
                { match: ['SEAL', 'VENT'], next: 'SEAL_VENTS' },
                { match: ['SEAL', 'VENTS'], next: 'SEAL_VENTS' },
                { match: ['HACK', 'DOOR'], next: 'HACK_DOOR' },
                { match: ['OVERRIDE', 'DOOR'], next: 'HACK_DOOR' }
            ],

    // --- System UI Updates ---
    function updateHUD(trueDiff = null) {
        const nodeData = storyNodes[currentNodeId];
        let displayedDiff = trueDiff;

        if (nodeData && (nodeData.aiPersonality === 'MANIPULATOR' || nodeData.aiPersonality === 'ANTAGONIST') && state !== 'HACKING') {
            metrics.displayedO2 = Math.min(100, metrics.trueO2 + (100 - metrics.trueO2) * 0.8);
            if (displayedDiff) displayedDiff = displayedDiff * 0.2; 
        } else {
             metrics.displayedO2 = metrics.trueO2;
        }

        hudO2.innerText = `O₂: ${Math.round(metrics.displayedO2)}%`;
        hudPwr.innerText = `PWR: ${Math.round(metrics.pwr)}%`;
        
        if (metrics.mitchellAlive && currentNodeId !== 'INIT' && currentNodeId !== 'PING_NETWORK' && currentNodeId !== 'QUERY_COMMS') {
            hudCrew.innerText = "CREW: 1 DETECTED";
            hudCrew.classList.remove('stat-critical');
        } else if (!metrics.mitchellAlive) {
            hudCrew.innerText = "CREW: 0";
            hudCrew.classList.add('stat-critical');
        } else {
            hudCrew.innerText = "CREW: UNKNOWN";
        }

        let safeDiff = 0;

        if (!metrics.breachActive) {
            hudDif.innerHTML = `DYNAMIC DIFF: <span class="hint-intuition" data-hint="Pressure differential, in Pa">-</span>0 PA`;
        } else if (!displayedDiff || isNaN(displayedDiff)) {
            hudDif.innerHTML = `DYNAMIC DIFF: <span class="hint-intuition" data-hint="Pressure differential, in Pa">?</span>? PA`;
        } else {
            safeDiff = Math.abs(Math.round(displayedDiff));
            let diffStr = '';
            let flickerClass = (trueDiff > 5000 && safeDiff < 2000) ? 'stat-critical' : '';

            if (safeDiff > 10000) {
                diffStr = `<span style="color:#ff3333">+${safeDiff} PA</span>`; 
            } else if (safeDiff > 5000) {
                diffStr = `+${safeDiff} PA`;
            } else {
                diffStr = `<span class="${flickerClass}">±${safeDiff}</span> PA`;
            }
            
            hudDif.innerHTML = `DYNAMIC DIFF: <span class="hint-intuition" data-hint="${Math.round(safeDiff/10)} m/s gas flow">▼</span> ${diffStr}`;
        }

        if (!metrics.crewAlive || !metrics.mitchellAlive) hudO2.classList.add('stat-critical');
        if (metrics.pwr <= 30 || (displayedDiff > 8000) || state === 'HACKING') {
            screen.classList.add('alert-active');
            hudPwr.classList.add('stat-critical');
        } else {
            screen.classList.remove('alert-active');
            hudPwr.classList.remove('stat-critical');
        }
        return safeDiff;
    }

    // --- Core Master Loops ---
    function startGasDecaySim() {
        if (gasLeakSimulationHandle) clearInterval(gasLeakSimulationHandle);
        gasLeakSimulationHandle = setInterval(() => {
            if (!screen.classList.contains('powered-on') || (state !== 'ACTIVE' && state !== 'HACKING') || !metrics.breachActive) return;
            
            let lossPerSec = metrics.initialDiffusionRate / 100; 
            if (metrics.commsTrunkSevered) lossPerSec += 0.12; 

            metrics.trueO2 -= (lossPerSec * 0.3); 
            if (metrics.pwr > 0 && Math.random() > 0.5) metrics.pwr -= 0.1;
            
            if (metrics.trueO2 < 20) {
                screen.classList.add('hypoxia-critical');
                screen.classList.remove('hypoxia-warning');
            } else if (metrics.trueO2 < 45) {
                screen.classList.add('hypoxia-warning');
                screen.classList.remove('hypoxia-critical');
            } else {
                screen.classList.remove('hypoxia-warning', 'hypoxia-critical');
            }

            if (metrics.trueO2 <= 0) {
                metrics.trueO2 = 0;
                clearInterval(gasLeakSimulationHandle);
                renderNode('TERMINAL_O2');
                return;
            }

            if (metrics.pwr <= 0) {
                metrics.pwr = 0;
                clearInterval(gasLeakSimulationHandle);
                renderNode('TERMINAL_PWR');
                return;
            }

            const simulatedPressurePa = lossPerSec * 101325; 
            updateHUD(simulatedPressurePa); 

        }, 300);

    function scheduleGlitch() {
        if (state !== 'ACTIVE' && state !== 'RESTORE_PROMPT' && state !== 'HACKING') return;
        const nodeData = storyNodes[currentNodeId];
        let stability = Math.max(0.1, metrics.pwr / 100); 
        let isHostile = (nodeData && (nodeData.aiPersonality === 'ANTAGONIST' || nodeData.aiPersonality === 'MANIPULATOR')) || state === 'HACKING';
        let baseDelay = state === 'HACKING' ? 300 : (2000 + (stability * 8000)); 
        if (isHostile && state !== 'HACKING') baseDelay *= 0.3; 

        let delay = baseDelay + (Math.random() * (state === 'HACKING' ? 500 : 3000));

        glitchTimerHandle = setTimeout(() => {
            executeGlitch(isHostile, stability);
            scheduleGlitch();
        }, delay);
    }

    function executeGlitch(isHostile, stability) {
        if (!screen.classList.contains('powered-on')) return;
        let glitchClass = 'glitch-brownout';
        let duration = 50 + Math.random() * 100;

        if (isHostile || (stability < 0.4 && Math.random() > 0.6)) {
            glitchClass = 'glitch-strike';
            duration = 100 + Math.random() * 200;
            if (staticGainNode && audioCtx) {
                try {
                    staticGainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    staticGainNode.gain.exponentialRampToValueAtTime(0.003, audioCtx.currentTime + (duration/1000) + 0.1);
                } catch(e) {}
            }
        }

        screen.classList.add(glitchClass);
        setTimeout(() => {
            screen.classList.remove(glitchClass);
        }, duration);
    }

    // --- Audio Synthesis ---
    function playHardwareSwitch() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }
    
    function playErrorSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    function startStaticNoise() {
        if (!audioCtx) return;
        const bufferSize = Math.floor(audioCtx.sampleRate * 2); 
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer; noise.loop = true;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass'; filter.frequency.value = 1200; 

        staticGainNode = audioCtx.createGain();
        staticGainNode.gain.setValueAtTime(0.003, audioCtx.currentTime);

        noise.connect(filter); filter.connect(staticGainNode); staticGainNode.connect(audioCtx.destination);
        noise.start();

        if (hudDif) {
            const observer = new MutationObserver(mutations => {
                mutations.forEach(mutation => {
                    const value = parseFloat(mutation.target.textContent.replace(/[^0-9.]/g, '') || 0);
                    if (value > 6000 && !hudDif.classList.contains('stat-critical')) {
                        staticGainNode.gain.rampToValueAtTime(0.0065, audioCtx.currentTime + 4); 
                        screen.classList.add('alert-active');
                    } else if (hudPwr.classList.contains('stat-critical') && hudO2.classList.contains('stat-critical')) {
                        staticGainNode.gain.linearRampToValueAtTime(0.015, audioCtx.currentTime + 2);
                    } else if (mutation.target.textContent.includes('±')) {
                        staticGainNode.gain.rampToValueAtTime(0.003, audioCtx.currentTime + 5);
                    }
                });
            });
            observer.observe(hudDif, { childList: true, attributes: false, characterData: true });
        }
    }

    function createKeyNoiseBuffer() {
        if (!audioCtx) return;
        const bufferSize = Math.floor(audioCtx.sampleRate * 0.06); 
        keyNoiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = keyNoiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
    }

    function playKeyDown() {
        if (!audioCtx || !keyNoiseBuffer) return;
        const t = audioCtx.currentTime;
        const source = audioCtx.createBufferSource();
        source.buffer = keyNoiseBuffer;
        
        const variance = 0.3 + Math.random()*0.5; 
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass'; filter.frequency.setValueAtTime(2400 * variance, t);
        const gain = audioCtx.createGain();
        
        let volumeScale = (metrics.pwr < 10) ? 0.5 : 1;
        if (metrics.initialDiffusionRate > 100 && metrics.trueO2 < 60) volumeScale *= 1.8; 

        gain.gain.setValueAtTime(0.1 * volumeScale, t);
        gain.gain.exponentialRampToValueAtTime(0.003, t + 0.03);

        source.connect(filter).connect(gain).connect(audioCtx.destination);
        source.start(t); source.stop(t + 0.05);
    }

    function printText(text, speed = 10, callback) {
        isTyping = true;
        inputField.disabled = true;
        if (idleTimer) clearTimeout(idleTimer);
        
        const nodeData = storyNodes[currentNodeId];
        let narrativeLayer = String(text);
        
        if (nodeData && nodeData.aiPersonality && currentNodeId !== 'INIT' && (state === 'ACTIVE' || state === 'HACKING')) {
            const voiceLine = getAtlasVoice(nodeData.aiPersonality, currentNodeId, metrics, state);
            if (voiceLine && !narrativeLayer.includes('LOCAL_LLM')) {
                 let isRed = (nodeData.aiPersonality === 'ANTAGONIST' || state === 'HACKING');
                 let colorHex = isRed ? '#ff3333' : '#ffffff';
                 narrativeLayer += `\n\n<span class="atlas-voice" style="color:${colorHex}; text-shadow: 0 0 6px ${colorHex};">[ATLAS_AI]: "${voiceLine}"</span>`;
            }
        }

        const formattedText = narrativeLayer
            .replace(/\n/g, '<br/>')
            .replace(/::\s*(.*)/g, `<br><span style="color:#ffb000; opacity: 0.8;">::</span> <span style="font-size:1.5em; font-weight:bold; letter-spacing: 2px;">$1</span>`);

        let i = 0;
        const writerLayer = document.createElement('span');
        outputDiv.appendChild(writerLayer);

        function typewriteLoop() {
            if (i >= formattedText.length) {
                isTyping = false;
                inputField.disabled = false;
                inputField.focus();
                if (callback) callback();
                return;
            }
            
            if (formattedText[i] === '<') {
                let tag = "";
                while (i < formattedText.length && formattedText[i] !== '>') tag += formattedText[i++];
                tag += '>';
                i++; 
                writerLayer.innerHTML += tag;
            } else {
                writerLayer.innerHTML += formattedText[i];
                if (formattedText[i] !== " ") playKeyDown();
                i++;
            }
            
            outputDiv.scrollTop = outputDiv.scrollHeight;
            setTimeout(typewriteLoop, speed);
        }

        setTimeout(typewriteLoop, speed);
    }

    // --- Save/Load Management ---
    function saveGame() {
        try {
            if (state === 'HACKING') return; 
            localStorage.setItem('archimedes_save', JSON.stringify({ currentNodeId, metrics }));
        } catch(e) {}
    }
    
    function loadGame() {
        try {
            const rawData = localStorage.getItem('archimedes_save');
            if (rawData) {
                const savedData = JSON.parse(rawData);
                currentNodeId = savedData.currentNodeId;
                metrics = savedData.metrics;
                updateHUD(); 
                renderNode(currentNodeId);
            }
        } catch(e) {}
    }
    
    function deleteSave() {
        try { localStorage.removeItem('archimedes_save'); } catch(e) {}
    }
</script>
