<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ATLAS Protocol - Executive Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #02040a; /* Almost black behind the chassis */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'VT323', monospace;
            overflow: hidden;
            user-select: none;
        }

        #chassis {
            background-color: #0a1128; /* Deep Navy */
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05) 0%, transparent 70%),
                url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.04"/%3E%3C/svg%3E');
            width: 96vw;
            height: 96vh;
            padding: 50px 40px 80px 40px; 
            border-radius: 16px; /* Sharper corners for federal feel */
            box-sizing: border-box;
            box-shadow: inset 0 0 40px #010205, 0 0 50px rgba(10, 17, 40, 0.8), 0 20px 50px rgba(0,0,0,0.9);
            border: 8px solid #050814;
            border-top: 8px solid #080d1f;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #bezel-stamp {
            position: absolute;
            top: 18px;
            left: 50px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
            pointer-events: none;
        }

        #screen {
            background: #030712; /* Core screen background */
            width: 100%;
            height: 100%;
            border-radius: 12px;
            padding: 30px;
            box-sizing: border-box;
            border: 2px solid rgba(88, 166, 255, 0.2); /* Subtle blue glow frame */
            box-shadow: inset 0 0 80px rgba(0,0,0,1), 0 0 15px rgba(88, 166, 255, 0.05);
            position: relative;
            display: flex;
            flex-direction: column;
            color: #f8fafc; /* Crisp White Text */
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.8), 0 0 8px rgba(255, 255, 255, 0.3); 
            font-size: 1.8rem;
            letter-spacing: 1px;
            line-height: 1.4;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.98; }
            50% { opacity: 1; }
            100% { opacity: 0.99; }
        }

        #screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 5;
            background-size: 100% 3px;
            pointer-events: none;
        }

        #output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 15px;
            padding-right: 15px;
            padding-top: 10px;
            z-index: 3;
            word-wrap: break-word;
        }

        .msg-block {
            margin-bottom: 20px;
        }

        #input-line {
            display: flex; 
            align-items: center;
            font-weight: bold;
            z-index: 3;
            margin-bottom: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #prompt { margin-right: 15px; color: #58a6ff; }

        input[type="text"] {
            background: transparent;
            border: none;
            color: inherit;
            font-family: 'VT323', monospace;
            font-size: 1em;
            flex-grow: 1;
            outline: none;
            text-transform: uppercase;
            text-shadow: inherit;
            letter-spacing: 2px;
        }

        #hud-bar {
            border-top: 2px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            margin-top: auto;
            font-size: 1.6rem;
            color: #f8fafc;
            z-index: 3;
            display: flex;
            justify-content: space-between;
        }

        .hud-stat { font-weight: bold; }
        
        /* Critical Red State */
        .stat-critical { color: #e63946 !important; text-shadow: 0 0 8px #e63946 !important; animation: blinker 1s infinite; }
        @keyframes blinker { 50% { opacity: 0.4; } }

        /* THE LEXICON ENGINE (Blue) */
        .lexicon-term {
            color: #58a6ff;
            text-decoration: underline;
            text-decoration-style: dotted;
            cursor: help;
            position: relative;
            text-shadow: 0 0 5px rgba(88, 166, 255, 0.6);
        }

        @media (hover) {
            .lexicon-term::after {
                content: attr(data-definition);
                position: absolute;
                bottom: 120%;
                left: 50%;
                transform: translateX(-50%);
                width: 450px;
                background: #050814;
                border: 1px solid #58a6ff;
                color: #f8fafc;
                padding: 15px;
                font-family: 'VT323', monospace;
                font-size: 1.4rem;
                line-height: 1.3;
                text-align: left;
                box-shadow: 0 10px 30px rgba(0,0,0,0.9);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s;
                z-index: 10;
                white-space: normal;
                text-shadow: none;
            }
            .lexicon-term:hover::after { opacity: 1; }
        }

        /* PROGRESSIVE DISCLOSURE ACCORDION (Red) */
        .decrypt-btn {
            display: inline-block;
            background: rgba(230, 57, 70, 0.1);
            border: 1px solid #e63946;
            color: #e63946;
            padding: 4px 10px;
            margin-top: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1em;
            text-shadow: 0 0 5px #e63946;
            transition: all 0.2s;
            user-select: none;
        }
        .decrypt-btn:hover {
            background: #e63946;
            color: #030712;
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.6);
            text-shadow: none;
        }
        .decrypt-content {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease-out, opacity 0.4s ease-out;
            color: #cbd5e1;
            border-left: 2px solid #e63946;
            padding-left: 15px;
            margin-top: 0px;
            text-shadow: none;
        }
        .decrypt-content.expanded {
            max-height: 1200px;
            opacity: 1;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .voice-cos { color: #94a3b8; font-weight: bold; } /* Muted silver for CoS */
        .voice-friedman { color: #ffffff; font-weight: bold; text-shadow: 0 0 5px #fff; } /* Stark white for Truth */
        .highlight-directive { color: #58a6ff; font-weight: bold; } /* Blue for player inputs */
        .sys-alert { color: #e63946; text-shadow: 0 0 5px #e63946; font-weight: bold; } /* Aggressive Red */

    </style>
</head>
<body>

<div id="chassis">
    <div class="rivet r-tl"></div>
    <div class="rivet r-tr"></div>
    <div class="rivet r-bl"></div>
    <div class="rivet r-br"></div>
    
    <div id="bezel-stamp">ATLAS // CONTINUITY OF GOV // v1.3</div>

    <div id="screen">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">EXEC_CMD></span>
            <input type="text" id="cmd" autocomplete="off" autofocus>
        </div>
        <div id="hud-bar">
            <span id="hud-pp" class="hud-stat">PP: 100%</span>
            <span id="hud-pol" class="hud-stat">POL: 50%</span>
            <span id="hud-vel" class="hud-stat">VEL: 100%</span>
            <span id="hud-fric" class="hud-stat">FRIC: 0%</span>
        </div>
    </div>
</div>

<script>
    const outputDiv = document.getElementById('output');
    const inputField = document.getElementById('cmd');

    let metrics = {
        pp: 100,      // Purchasing Power
        pol: 50,      // Political Capital
        vel: 100,     // Capital Velocity
        friction: 0   // Systemic Friction
    };

    let currentNodeId = 'SETUP_1';
    let isTyping = false;

    // THE PHASED NARRATIVE MATRIX
    const storyNodes = {
        'SETUP_1': {
            text: `<span class="sys-alert">> SYSTEM ALERT: CRISIS PROTOCOL INITIATED</span>\n
<span class="voice-cos">[CHIEF OF STAFF]:</span> "Mr. President, the <u class="lexicon-term" data-definition="Consumer Price Index (Core). Strips out food and energy under the guise of 'volatility'. True incentive: If the government reported true inflation including food and fuel, entitlement obligations tied to CPI would bankrupt the Treasury.">Core CPI</u> print came in hot. Housing costs in major metros are up 18% YoY. Congress just put the 'Emergency Rent Stabilization Act' on your desk. It caps rent increases at 2% nationally. If we veto this, we hemorrhage seats in the midterms. We need a signature."\n
<span style="color:#64748b;">>> TYPE 'ANALYZE' TO ENGAGE FRIEDMAN PROTOCOL</span>`,
            choices: { 'ANALYZE': 'FRIEDMAN_1' }
        },
        
        'FRIEDMAN_1': {
            text: `> INITIATE_FRIEDMAN_PROTOCOL...\n
<span class="voice-friedman">[FRIEDMAN_AI]:</span> "The political instinct is to treat the symptom. We must treat the incentive. If you dictate that a builder cannot charge the market clearing rate, capital will instantly reallocate away from housing. A price ceiling creates a visual illusion of affordability while mathematically guaranteeing a physical shortage."\n
<div class="decrypt-btn" onclick="toggleDecrypt(this)">[+] DECRYPT SECOND-ORDER PHYSICS</div>
<div class="decrypt-content">The bill contains a <u class="lexicon-term" data-definition="A legal mechanism where developers pay zero property taxes for decades if they designate a fraction of units as 'affordable'. True incentive: Forfeits municipal revenue, shifting the tax burden to the existing middle class to subsidize institutional profit margins.">421-a Tax Abatement</u>. By suppressing the legal price of a commodity, the cost does not disappear; it is transferred to the political sphere. Incumbent developers will use the abatement to monopolize new builds, while existing housing stock rots as landlords slash maintenance to preserve margins.</div>\n
<span style="color:#64748b;">>> TYPE 'DIRECTIVES' TO VIEW EXECUTIVE OPTIONS</span>`,
            choices: { 'DIRECTIVES': 'CHOICES_1' }
        },

        'CHOICES_1': {
            text: `SYSTEM AWAITING EXECUTIVE DIRECTIVE:\n
<span class="highlight-directive">:: SIGN_STABILIZATION_ACT</span>
(The Political Play: Secure midterms, lock in generational housing deficit.)

<span class="highlight-directive">:: VETO_AND_SUBSIDIZE</span>
(The Coward's Compromise: Float rents, issue federal housing vouchers. Drives localized inflation.)

<span class="highlight-directive">:: VETO_AND_DEREGULATE</span>
(The Structural Fix: Withhold federal highway funds to break localized zoning laws.)`,
            choices: { 
                'SIGN_STABILIZATION_ACT': 'BLOCKADE_1', 
                'VETO_AND_SUBSIDIZE': 'BLOCKADE_1', 
                'VETO_AND_DEREGULATE': 'BLOCKADE_1' 
            }
        },

        'BLOCKADE_1': {
            effect: (m) => { m.pol -= 10; },
            text: `> EXECUTING STRUCTURAL FIX...
<span class="sys-alert">> ERROR: LEGISLATIVE BLOCKADE DETECTED.</span>\n
<span class="voice-cos">[CHIEF OF STAFF]:</span> "We are dead on arrival. The Senate Whip reports we have 47 votes. We need 51 to push the deregulation mandate past the committee. The farm lobby controls the missing four senators. They will not vote for your housing fix unless you pay the toll."\n
<span style="color:#64748b;">>> TYPE 'DIRECTIVES' TO VIEW CAPITULATION OPTIONS</span>`,
            choices: { 'DIRECTIVES': 'CHOICES_2' }
        },

        'CHOICES_2': {
            text: `SYSTEM AWAITING CAPITULATION DIRECTIVE:\n
<span class="highlight-directive">:: APPEND_RIDER_AG_SUBSIDY</span>
(Inject $50B in printed liquidity to domestic corn producers. Secures +4 Votes.)

<span class="highlight-directive">:: BURN_POLITICAL_CAPITAL</span>
(Rely on executive orders. Bypasses the Senate entirely. -40 POL.)`,
            choices: { 'APPEND_RIDER_AG_SUBSIDY': 'AG_SUBSIDY', 'BURN_POLITICAL_CAPITAL': 'BURN_POL' }
        },

        'AG_SUBSIDY': {
            effect: (m) => { m.vel += 15; m.friction -= 10; m.pp -= 8; },
            text: `> RIDER APPENDED. DEREGULATION PASSED.\n
<span class="voice-friedman">[FRIEDMAN_AI]:</span> "Structural fix achieved. Local zoning is broken. Capital will flood the housing market, lowering costs over the next 36 months.\n
However, the $50B injection triggers localized inflation via the <u class="lexicon-term" data-definition="The observation that newly created fiat money does not enter the economy evenly. It benefits those closest to the creation point (asset holders, subsidized industries) before filtering down to wages, structurally reducing the purchasing power of the working class.">Cantillon Effect</u>. Absolute Purchasing Power (PP) has dropped. You fixed housing, but you debased the currency to do it."\n
<span style="color:#64748b;">>> SYSTEM HALTED FOR DIAGNOSTICS.</span>`,
            choices: {}
        },

        'BURN_POL': {
            effect: (m) => { m.pol -= 40; m.vel += 15; m.friction -= 15; },
            text: `> EXECUTIVE ORDER ISSUED. DEREGULATION PASSED.\n
<span class="voice-cos">[CHIEF OF STAFF]:</span> "You got your clean bill, but the Senate is furious. We are politically bankrupt. Do not expect them to pass anything else this year."\n
<span class="voice-friedman">[FRIEDMAN_AI]:</span> "You absorbed the political cost to maintain mathematical integrity. Purchasing Power remains intact."\n
<span style="color:#64748b;">>> SYSTEM HALTED FOR DIAGNOSTICS.</span>`,
            choices: {}
        }
    };

    function updateHUD() {
        document.getElementById('hud-pp').innerText = `PP: ${metrics.pp}%`;
        document.getElementById('hud-pol').innerText = `POL: ${metrics.pol}%`;
        document.getElementById('hud-vel').innerText = `VEL: ${metrics.vel}%`;
        document.getElementById('hud-fric').innerText = `FRIC: ${metrics.friction}%`;
        
        if(metrics.pp < 50) document.getElementById('hud-pp').classList.add('stat-critical');
        if(metrics.pol < 20) document.getElementById('hud-pol').classList.add('stat-critical');
    }

    // String-builder typewriter prevents unclosed tags and DOM corruption
    function printText(textString, speed = 8, callback) {
        isTyping = true;
        inputField.disabled = true;
        
        let i = 0;
        let currentHTML = "";
        
        const block = document.createElement('div');
        block.className = 'msg-block';
        outputDiv.appendChild(block);

        function type() {
            if (i < textString.length) {
                if (textString.charAt(i) === '<') {
                    let tag = "";
                    while (textString.charAt(i) !== '>' && i < textString.length) {
                        tag += textString.charAt(i);
                        i++;
                    }
                    tag += '>';
                    currentHTML += tag;
                } else {
                    currentHTML += textString.charAt(i);
                }
                
                block.innerHTML = currentHTML;
                i++;
                outputDiv.scrollTop = outputDiv.scrollHeight;
                setTimeout(type, speed);
            } else {
                isTyping = false;
                inputField.disabled = false;
                inputField.focus();
                if (callback) callback();
            }
        }
        type();
    }

    function toggleDecrypt(btn) {
        const content = btn.nextElementSibling;
        if (content && content.classList.contains('decrypt-content')) {
            content.classList.toggle('expanded');
            btn.innerText = content.classList.contains('expanded') 
                ? '[-] COLLAPSE STRUCTURAL AUDIT' 
                : '[+] DECRYPT SECOND-ORDER PHYSICS';
            setTimeout(() => outputDiv.scrollTop = outputDiv.scrollHeight, 150);
        }
    }

    function renderNode(nodeId) {
        currentNodeId = nodeId;
        const nodeRaw = storyNodes[nodeId];
        
        if (typeof nodeRaw.effect === 'function') {
            nodeRaw.effect(metrics);
            updateHUD();
        }

        printText(nodeRaw.text);
    }

    function handleInput(rawCmd) {
        if (isTyping) return;
        
        const cmd = rawCmd.trim().toUpperCase().replace(/\s+/g, '_');
        if (cmd === '') return;

        // Echo command
        const echoBlock = document.createElement('div');
        echoBlock.style.color = '#58a6ff';
        echoBlock.style.marginBottom = '15px';
        echoBlock.innerHTML = `> ${cmd}`;
        outputDiv.appendChild(echoBlock);
        
        inputField.value = '';

        const node = storyNodes[currentNodeId];
        let nextNodeId = null;

        if (node.choices) {
            for (const [key, val] of Object.entries(node.choices)) {
                if (cmd === key.toUpperCase()) {
                    nextNodeId = val;
                    break;
                }
            }
            
            if (nextNodeId && storyNodes[nextNodeId]) {
                renderNode(nextNodeId);
            } else {
                printText(`<span class="sys-alert">> UNRECOGNIZED COMMAND. VALIDATE INPUT.</span>`, 5);
            }
        }
    }

    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleInput(inputField.value);
        }
    });

    // Boot Sequence
    setTimeout(() => {
        updateHUD();
        renderNode('SETUP_1');
    }, 500);

</script>
</body>
</html>
